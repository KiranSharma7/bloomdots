<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #111111; padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip {
    background: #1A1A1A;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2E2E2E;
  }
  .chip-swatch { height: 36px; }
  .chip-info { padding: 6px 8px; }
  .chip-name { font-size: 10px; font-weight: 600; color: #ccc; line-height: 1.3; }
  .chip-val  { font-size: 9px; color: #666; font-family: monospace; margin-top: 1px; }
  .row2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div class="grid">
  <div class="chip"><div class="chip-swatch" style="background:#111111; border-bottom:1px solid #2e2e2e"></div><div class="chip-info"><div class="chip-name">bg</div><div class="chip-val">#111111</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#1A1A1A"></div><div class="chip-info"><div class="chip-name">bg-surface</div><div class="chip-val">#1A1A1A</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#242424"></div><div class="chip-info"><div class="chip-name">bg-raised</div><div class="chip-val">#242424</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#2E2E2E"></div><div class="chip-info"><div class="chip-name">border</div><div class="chip-val">#2E2E2E</div></div></div>
</div>
<div class="row2">
  <div class="chip"><div class="chip-swatch" style="background:#F5F5F5"></div><div class="chip-info"><div class="chip-name">fg</div><div class="chip-val">#F5F5F5</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#EDEDED"></div><div class="chip-info"><div class="chip-name">fg-1</div><div class="chip-val">#EDEDED</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#B0B0B0"></div><div class="chip-info"><div class="chip-name">fg-2</div><div class="chip-val">#B0B0B0</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#777777"></div><div class="chip-info"><div class="chip-name">fg-3</div><div class="chip-val">#777777</div></div></div>
</div>
<div class="row2">
  <div class="chip"><div class="chip-swatch" style="background:#F08165"></div><div class="chip-info"><div class="chip-name">interactive</div><div class="chip-val">#F08165</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#3DC87A"></div><div class="chip-info"><div class="chip-name">success</div><div class="chip-val">#3DC87A</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#FAB72B"></div><div class="chip-info"><div class="chip-name">warning</div><div class="chip-val">#FAB72B</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#F04438"></div><div class="chip-info"><div class="chip-name">error</div><div class="chip-val">#F04438</div></div></div>
</div>
</body>
</html>
