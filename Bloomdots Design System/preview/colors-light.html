<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #F7F7F7; padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .chip-swatch { height: 36px; }
  .chip-info { padding: 6px 8px; }
  .chip-name { font-size: 10px; font-weight: 600; color: #333; line-height: 1.3; }
  .chip-val  { font-size: 9px; color: #888; font-family: monospace; margin-top: 1px; }
  .row2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div class="grid">
  <div class="chip"><div class="chip-swatch" style="background:#FFFFFF; border-bottom:1px solid #e2e2e2"></div><div class="chip-info"><div class="chip-name">bg</div><div class="chip-val">#FFFFFF</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#F7F7F7"></div><div class="chip-info"><div class="chip-name">bg-surface</div><div class="chip-val">#F7F7F7</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#EFEFEF"></div><div class="chip-info"><div class="chip-name">bg-raised</div><div class="chip-val">#EFEFEF</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#E2E2E2"></div><div class="chip-info"><div class="chip-name">border</div><div class="chip-val">#E2E2E2</div></div></div>
</div>
<div class="row2">
  <div class="chip"><div class="chip-swatch" style="background:#111111"></div><div class="chip-info"><div class="chip-name">fg</div><div class="chip-val">#111111</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#1A1A1A"></div><div class="chip-info"><div class="chip-name">fg-1</div><div class="chip-val">#1A1A1A</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#444444"></div><div class="chip-info"><div class="chip-name">fg-2</div><div class="chip-val">#444444</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#888888"></div><div class="chip-info"><div class="chip-name">fg-3</div><div class="chip-val">#888888</div></div></div>
</div>
<div class="row2">
  <div class="chip"><div class="chip-swatch" style="background:#E84E28"></div><div class="chip-info"><div class="chip-name">interactive</div><div class="chip-val">#E84E28</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#1B9E5B"></div><div class="chip-info"><div class="chip-name">success</div><div class="chip-val">#1B9E5B</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#E09F14"></div><div class="chip-info"><div class="chip-name">warning</div><div class="chip-val">#E09F14</div></div></div>
  <div class="chip"><div class="chip-swatch" style="background:#D0291C"></div><div class="chip-info"><div class="chip-name">error</div><div class="chip-val">#D0291C</div></div></div>
</div>
</body>
</html>
