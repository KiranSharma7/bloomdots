<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet the Team — bloomdots</title>

  <!-- GSAP CDN -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ============================================================
       bloomdots — Team sticker section
       ============================================================ */

    :root {
      --bg: #f9fafb;
      --ink: #111418;
      --ink-soft: #4b5563;
      --tooltip-head-bg: #29B9EA;    /* bloomdots cyan */
      --tooltip-head-bg-2: #5fcef1;
      --tooltip-body-bg: #ffffff;
      --tooltip-ink: #111418;
      --tooltip-ink-soft: #6b7280;
      --linkedin-bg: #111418;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;        /* never produce a horizontal scrollbar */
    }

    /* ---------- Header ---------- */
    .team-header {
      text-align: center;
      padding: 48px 24px 8px;
      max-width: 760px;
      margin: 0 auto;
    }
    .team-header .eyebrow {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .team-header h1 {
      margin: 8px 0 14px;
      font-size: clamp(28px, 4.4vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .team-header .lede {
      margin: 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.5;
      max-width: 56ch;
      margin-inline: auto;
    }

    /* ---------- Canvas ---------- */
    .team-canvas {
      position: relative;
      width: 100%;
      min-height: 100vh;       /* at least one full viewport */
      margin: 16px 0 80px;
    }

    /* ---------- Sticker nodes ---------- */
    .sticker-node {
      position: absolute;
      width: 150px;
      height: 150px;
      cursor: pointer;
      user-select: none;
      transform: translateZ(0);
      contain: layout paint style;
      /* Die-cut white border via stacked drop-shadows + soft outer shadow */
      filter:
        drop-shadow( 2px  0 0 #ffffff)
        drop-shadow(-2px  0 0 #ffffff)
        drop-shadow( 0  2px 0 #ffffff)
        drop-shadow( 0 -2px 0 #ffffff)
        drop-shadow(0 10px 14px rgba(0, 0, 0, 0.22));
    }

    .sticker-node img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .sticker-node.is-hovered {
      filter:
        drop-shadow( 2px  0 0 #ffffff)
        drop-shadow(-2px  0 0 #ffffff)
        drop-shadow( 0  2px 0 #ffffff)
        drop-shadow( 0 -2px 0 #ffffff)
        drop-shadow(0 18px 26px rgba(0, 0, 0, 0.28));
    }

    .sticker-node:focus-visible {
      outline: 3px solid var(--tooltip-head-bg);
      outline-offset: 8px;
      border-radius: 50%;
    }

    /* ---------- Tooltip ---------- */
    .tooltip {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      background: var(--tooltip-body-bg);
      color: var(--tooltip-ink);
      border-radius: 10px;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.22),
                  0 2px 6px rgba(15, 23, 42, 0.08);
      opacity: 0;
      pointer-events: none;
      transform: translate(var(--tooltip-x, 0px), var(--tooltip-y, 0px)) scale(0.96);
      transform-origin: top left;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 9999;
      font-size: 13.5px;
      line-height: 1.5;
      overflow: hidden;
      contain: layout paint style;
    }
    .tooltip.is-visible {
      opacity: 1;
      transform: translate(var(--tooltip-x, 0px), var(--tooltip-y, 0px)) scale(1);
    }

    /* Cyan header strip — name + title + LinkedIn badge */
    .tooltip-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 14px 14px 16px;
      background: linear-gradient(180deg, var(--tooltip-head-bg-2) 0%, var(--tooltip-head-bg) 100%);
      color: #ffffff;
    }
    .tooltip-head-text { min-width: 0; }
    .tooltip-name {
      margin: 0 0 2px;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    .tooltip-title {
      margin: 0;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
    }
    .tooltip-linkedin {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      background: var(--linkedin-bg);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .tooltip-linkedin:hover {
      background: #000;
      transform: translateY(-1px);
    }

    /* White body */
    .tooltip-details {
      list-style: disc;
      padding: 14px 18px 16px 32px;
      margin: 0;
    }
    .tooltip-details li {
      margin: 0 0 8px;
      color: var(--tooltip-ink);
    }
    .tooltip-details li:last-child { margin-bottom: 0; }
    .tooltip-details .label { font-weight: 700; color: var(--tooltip-ink); }
    .tooltip-details .val   { color: var(--tooltip-ink); }
    .tooltip-details .val-quote {
      display: inline;
      color: var(--tooltip-ink);
    }
    .tooltip-details .val-author {
      display: block;
      margin-top: 2px;
      color: var(--tooltip-ink-soft);
      font-size: 12.5px;
    }

    /* Directional arrow — JS sets data-side to switch direction */
    .tooltip-arrow {
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--tooltip-head-bg); /* arrow inherits the cyan header */
      transform: rotate(45deg);
      left: -7px;
      top: 26px;                  /* aligns with header strip */
      z-index: -1;
    }
    .tooltip[data-side="right"] .tooltip-arrow {
      left: auto; right: -7px; top: 26px;
    }
    .tooltip[data-side="up"] .tooltip-arrow {
      left: 30px; top: auto; bottom: -7px;
      background: var(--tooltip-body-bg);
      z-index: 1;
    }
    .tooltip[data-side="down"] .tooltip-arrow {
      left: 30px; top: -7px;
      background: var(--tooltip-head-bg-2); /* matches gradient top */
      z-index: 1;
    }

    /* ---------- Responsive sizing ---------- */
    @media (max-width: 900px) {
      .sticker-node { width: 120px; height: 120px; }
    }
    @media (max-width: 600px) {
      .team-header .lede { max-width: 31ch; }
      .sticker-node { width: 95px; height: 95px; }
      .tooltip { width: 260px; font-size: 12.5px; }
      .tooltip-name { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tooltip {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <script>
    /* ============================================================
       bloomdots — Team sticker scatter

    /* ---------- 1. Mock data ---------- */

        teams: "Brand & Illustration", years: 8,
        quote: "Drawing is the honesty of the art", author: "Salvador Dalí",
        pleasure: "Doodles on his coffee cups, then keeps them", linkedin: "#" },
      { name: "Reena Maharjan",  title: "People Ops Lead", img: img("width_800%20(14).png"),
        teams: "People & Operations", years: 11,
        quote: "Take care of your employees and they'll take care of your business", author: "Richard Branson",

      { name: "Tenzin Dorje",    title: "Product Designer", img: img("width_800%20(15).png"),
        teams: "Product & UX", years: 5,
        quote: "Design is not just what it looks like — design is how it works", author: "Steve Jobs",
        pleasure: "Owns 6 nearly identical mechanical keyboards", linkedin: "#" },
      { name: "Sabina KC",       title: "Photographer & Stylist", img: img("width_800%20(16).png"),
        teams: "Content & Brand", years: 9,
        quote: "You don't take a photograph, you make it", author: "Ansel Adams",
        pleasure: "Cleans her lenses more than her glasses", linkedin: "#" },
      { name: "Aakash Subedi",   title: "Sound & Audio Designer", img: img("width_800%20(17).png"),
        teams: "Motion & Audio", years: 7,
        quote: "Without music, life would be a mistake", author: "Friedrich Nietzsche",
        pleasure: "Foley-records his own footsteps in the kitchen", linkedin: "#" },
      { name: "Manisha Rana",    title: "QA & Test Lead", img: img("width_800%20(18).png"),
        teams: "Engineering & QA", years: 8,
        quote: "If debugging is the process of removing bugs, then programming must be the process of putting them in", author: "Edsger Dijkstra",
        pleasure: "Files bug reports about real-world products", linkedin: "#" },
      // 21st — reuses the first image (only 20 unique photos were provided)
      { name: "Bishal Khatri",   title: "Growth Marketer", img: img("width_792.png"),
        teams: "Growth & Marketing", years: 6,
        quote: "The best way to predict the future is to create it", author: "Peter Drucker",
        pleasure: "A/B tests his own breakfast", linkedin: "#" }
    ];

    /* ---------- 2. Utilities ---------- */
    // Seeded RNG so the scatter looks the same across reloads.
    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20260522);
    const rng  = (min, max) => min + (max - min) * rand();
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ---------- 3. Build the scatter ---------- */
    const canvas = document.getElementById("team-canvas");
    const tooltip = document.getElementById("tooltip");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const tooltipName  = tooltip.querySelector(".tooltip-name");
    const tooltipTitle = tooltip.querySelector(".tooltip-title");
    const tooltipLI    = tooltip.querySelector(".tooltip-linkedin");
    const tooltipVals = {
      teams:    tooltip.querySelector('[data-key="teams"]'),
      years:    tooltip.querySelector('[data-key="years"]'),
      quote:    tooltip.querySelector('[data-key="quote"]'),
      author:   tooltip.querySelector('[data-key="author"]'),
      pleasure: tooltip.querySelector('[data-key="pleasure"]')
    };

    const REPULSION_RADIUS = 130;    // px — how close the cursor must get
    const REPULSION_STRENGTH = 90;   // px — how far the sticker is pushed

    const nodes = [];
    let canvasRect = canvas.getBoundingClientRect();

    function refreshCanvasRect() {
      canvasRect = canvas.getBoundingClientRect();
    }

    window.addEventListener("scroll", refreshCanvasRect, { passive: true });

    /* Row-packed layout, inspired by the reference: every sticker sits in a
       row, but with horizontal/vertical jitter and a wide rotation range so
       the result still feels organic, not gridded. */
    function buildScatter() {
      const W = canvas.clientWidth;
      const isMobile = W < 700;
      const isSmall  = W < 500;

      // Sticker size (matches CSS)
      const size = isSmall ? 95 : (isMobile ? 120 : 150);

      // Choose columns so cells stay roughly square and at least a few stickers
      // fit per row even on small screens.
      let cols;
      if (isSmall)       cols = 3;
      else if (isMobile) cols = 4;
      else if (W < 1100) cols = 5;
      else if (W < 1500) cols = 6;
      else               cols = 7;

      const rows = Math.ceil(TEAM.length / cols);

      // Cell sizing: each sticker gets a cell slightly larger than itself so they
      // pack tightly without overlapping centres. Negative gap is fine — the
      // images are transparent PNGs and overlap reads as depth.
      const cellW = size * 1.05;
      const cellH = size * 1.0;
      const edgePad = isSmall ? 20 : 8;

      // Total grid block size — centre it horizontally inside the canvas.
      const blockW = cellW * cols;
      const offsetX = Math.max(edgePad, (W - blockW) / 2);
      const offsetY = 40;

      // Canvas height grows to fit all rows
      const H = offsetY + rows * cellH + 80;
      canvas.style.height = H + "px";

      // Per-cell jitter — how far a sticker can wander from its cell centre
      const jitterX = size * 0.22;
      const jitterY = size * 0.22;

      // Shuffle indices so visually similar stickers don't end up next to each
      // other every reload (still deterministic via the seeded RNG).
      const order = Array.from({ length: TEAM.length }, (_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }

      for (let idx = 0; idx < TEAM.length; idx++) {
        const dataIndex = order[idx];
        const row = Math.floor(idx / cols);
        const col = idx % cols;

        // Stagger every other row so the packing looks brick-laid, not gridded
        const rowStagger = (row % 2 === 0) ? 0 : cellW * 0.5;

        let cx = offsetX + col * cellW + cellW / 2 + rowStagger;
        let cy = offsetY + row * cellH + cellH / 2;

        cx += rng(-jitterX, jitterX);
        cy += rng(-jitterY, jitterY);

        // Convert centre to top-left
        let x = cx - size / 2;
        let y = cy - size / 2;

        // Keep stickers fully inside the canvas
        x = clamp(x, edgePad, W - size - edgePad);
        y = clamp(y, 4, H - size - 4);

        const data = TEAM[dataIndex];
        const el = document.createElement("div");
        el.className = "sticker-node";
        el.tabIndex = 0;
        el.setAttribute("role", "button");
        el.setAttribute("aria-label", `View ${data.name}'s team profile`);
        el.style.width  = size + "px";
        el.style.height = size + "px";
        el.style.left   = x + "px";
        el.style.top    = y + "px";

        const im = document.createElement("img");
        im.src = data.img;
        im.alt = data.name;
        im.draggable = false;
        im.decoding = "async";
        im.loading = idx < cols ? "eager" : "lazy";
        im.fetchPriority = idx < cols ? "high" : "low";
        el.appendChild(im);

        // Random initial rotation between -180 and +180
        const initialRot = rng(-180, 180);
        gsap.set(el, { rotation: initialRot, x: 0, y: 0 });

        canvas.appendChild(el);

        const node = {
          el, data, size,
          baseX: x, baseY: y,
          baseRot: initialRot,
          offsetX: 0, offsetY: 0, rot: initialRot,
          hovered: false,
          idleTween: null
        };
        nodes.push(node);

        if (!reduceMotion) startIdleFloat(node);
        attachHoverHandlers(node);
      }

      refreshCanvasRect();
    }

    /* ---------- 4. Continuous idle drifting ---------- */
    function startIdleFloat(node) {
      // Pick fresh random targets and tween toward them with a yoyo loop.
      const dx = rng(-15, 15);
      const dy = rng(-15, 15);
      const dr = rng(-5, 5);
      const dur = rng(2.2, 3.4);

      node.idleTween = gsap.to(node.el, {
        x: `+=${dx}`,
        y: `+=${dy}`,
        rotation: `+=${dr}`,
        duration: dur,
        ease: "sine.inOut",
        repeat: -1,
        yoyo: true,
        onUpdate: () => {
          // Cache current transform so the repulsion math knows where we are
          node.offsetX = gsap.getProperty(node.el, "x");
          node.offsetY = gsap.getProperty(node.el, "y");
          node.rot     = gsap.getProperty(node.el, "rotation");
        }
      });
    }

    /* ---------- 5. Pointer repulsion ----------
       We listen on the window and use `clientX/clientY` (viewport space). Sticker
       centres come from `getBoundingClientRect()` — that already accounts for
       page scroll, so the math stays correct as the user scrolls. */
    let mouseX = -9999, mouseY = -9999;
    let rafQueued = false;

    window.addEventListener("pointermove", (e) => {
      if (reduceMotion) return;
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!rafQueued) {
        rafQueued = true;
        requestAnimationFrame(applyRepulsion);
      }
    }, { passive: true });

    function applyRepulsion() {
      rafQueued = false;
      for (const node of nodes) {
        if (node.hovered) continue;

        const currentX = gsap.getProperty(node.el, "x");
        const currentY = gsap.getProperty(node.el, "y");
        const cx = canvasRect.left + node.baseX + node.size / 2 + currentX;
        const cy = canvasRect.top + node.baseY + node.size / 2 + currentY;
        const dx = cx - mouseX;
        const dy = cy - mouseY;
        const dist = Math.hypot(dx, dy);

        if (dist < REPULSION_RADIUS && dist > 0.01) {
          // Strength fades with distance — fade==1 right at the cursor, 0 at edge
          const fade = 1 - dist / REPULSION_RADIUS;
          const push = REPULSION_STRENGTH * fade;
          const ux = dx / dist;
          const uy = dy / dist;

          if (node.idleTween) node.idleTween.pause();

          gsap.to(node.el, {
            x: node.offsetX + ux * push,
            y: node.offsetY + uy * push,
            duration: 0.4,
            ease: "power3.out",
            overwrite: "auto"
          });
          node._repulsed = true;
        } else if (node._repulsed) {
          // Spring back to the idle path
          node._repulsed = false;
          gsap.to(node.el, {
            x: node.offsetX,
            y: node.offsetY,
            duration: 0.8,
            ease: "power4.out",
            overwrite: "auto",
            onComplete: () => { if (node.idleTween) node.idleTween.resume(); }
          });
        }
      }
    }

    /* ---------- 6. Hover + tooltip ---------- */
    function attachHoverHandlers(node) {
      const activate = () => {
        node.hovered = true;
        node.el.classList.add("is-hovered");
        node.el.style.zIndex = 1000;

        if (node.idleTween) node.idleTween.pause();

        if (reduceMotion) {
          gsap.set(node.el, { scale: 1.08, rotation: 0 });
        } else {
          gsap.to(node.el, {
            scale: 1.15,
            rotation: 0,
            duration: 0.28,
            ease: "power4.out",
            overwrite: "auto"
          });
        }

        showTooltip(node);
      };

      const deactivate = () => {
        node.hovered = false;
        node.el.classList.remove("is-hovered");
        node.el.style.zIndex = "";

        if (reduceMotion) {
          gsap.set(node.el, { scale: 1, rotation: node.baseRot });
        } else {
          gsap.to(node.el, {
            scale: 1,
            rotation: node.baseRot,
            duration: 0.42,
            ease: "power4.out",
            overwrite: "auto",
            onComplete: () => { if (node.idleTween) node.idleTween.resume(); }
          });
        }

        hideTooltip();
      };

      node.el.addEventListener("mouseenter", activate);
      node.el.addEventListener("focus", activate);

      node.el.addEventListener("mouseleave", () => {
        if (document.activeElement !== node.el) deactivate();
      });

      node.el.addEventListener("blur", deactivate);

      node.el.addEventListener("click", () => {
        node.el.focus({ preventScroll: true });
      });

      node.el.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          node.el.focus({ preventScroll: true });
        }
      });
    }

    /* ---------- 7. Smart tooltip positioning ---------- */
    function showTooltip(node) {
      const d = node.data;
      tooltipName.textContent  = d.name;
      tooltipTitle.textContent = d.title;
      tooltipLI.href = d.linkedin || "#";
      tooltipLI.tabIndex = d.linkedin && d.linkedin !== "#" ? 0 : -1;
      tooltipVals.teams.textContent    = d.teams;
      tooltipVals.years.textContent    = d.years;
      tooltipVals.quote.textContent    = `"${d.quote}"`;
      tooltipVals.author.textContent   = d.author;
      tooltipVals.pleasure.textContent = d.pleasure;

      tooltip.classList.add("is-visible");
      tooltip.setAttribute("aria-hidden", "false");

      positionTooltip(node);
    }

    function positionTooltip(node) {
      const r = node.el.getBoundingClientRect();
      const tw = tooltip.offsetWidth;
      const th = tooltip.offsetHeight;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const gap = 14;

      // Preferred: tooltip on the right of the sticker
      let side = "left";   // arrow points LEFT (tooltip on the right)
      let x = r.right + gap;
      let y = r.top + r.height / 2 - 36;

      // Flip to the left side if it would overflow the right edge
      if (x + tw > vw - 8) {
        x = r.left - gap - tw;
        side = "right";    // arrow points RIGHT (tooltip on the left)
      }
      // If it overflows both sides, fall back to above / below
      if (x < 8) {
        x = clamp(r.left + r.width / 2 - tw / 2, 8, vw - tw - 8);
        if (r.bottom + gap + th < vh - 8) {
          y = r.bottom + gap;
          side = "down";
        } else {
          y = r.top - gap - th;
          side = "up";
        }
      } else {
        y = clamp(y, 8, vh - th - 8);
      }

      tooltip.dataset.side = side;
      tooltip.style.setProperty("--tooltip-x", `${x}px`);
      tooltip.style.setProperty("--tooltip-y", `${y}px`);
    }

    function hideTooltip() {
      tooltip.classList.remove("is-visible");
      tooltip.setAttribute("aria-hidden", "true");
      tooltipLI.tabIndex = -1;
    }

    /* ---------- 8. Boot + responsive rebuild ---------- */
    buildScatter();

    let resizeTO;
    window.addEventListener("resize", () => {
      refreshCanvasRect();
      clearTimeout(resizeTO);
      resizeTO = setTimeout(() => {
        nodes.forEach(n => { if (n.idleTween) n.idleTween.kill(); });
        nodes.length = 0;
        canvas.innerHTML = "";
        buildScatter();
      }, 180);
    });

    document.addEventListener("visibilitychange", () => {
      const method = document.hidden ? "pause" : "resume";
      nodes.forEach((node) => {
        if (node.idleTween && !node.hovered) node.idleTween[method]();
      });
    });
  </script>
</body>
</html>
